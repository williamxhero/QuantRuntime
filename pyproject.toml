[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-runtime"
version = "0.2.0"
description = "Qlib and Nautilus execution plane for Strategy Workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "nautilus_trader==1.231.0",
  "pandas==2.3.3",
  "psutil==7.0.0",
  "pyarrow==25.0.1",
  "pyqlib==0.9.7",
  "strategy-workspace>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]

[project.scripts]
quant-runtime = "quant_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_runtime"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "connected: requires the live yosef-server MarketHub endpoint",
  "engine: requires the pinned NautilusTrader runtime",
]

[tool.uv.sources]
strategy-workspace = { path = "../strategy-workspace", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
