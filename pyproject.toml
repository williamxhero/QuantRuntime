[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markethub-qlib"
version = "0.1.0"
description = "Independent Qlib discovery workspace backed by fail-closed MarketHub reads"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "pandas==2.2.3",
  "pyqlib==0.9.7",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.9",
]

[project.scripts]
markethub-qlib = "markethub_qlib.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/markethub_qlib"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "connected: requires the live yosef-server MarketHub endpoint",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
